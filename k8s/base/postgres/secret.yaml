# NOTE: In production, never commit plain secrets to Git.
# We'll replace this with Sealed Secrets in Phase 8.
# Values are base64-encoded:
#   echo -n "shopstream" | base64    → c2hvcHN0cmVhbQ==
#   echo -n "shopstream123" | base64 → c2hvcHN0cmVhbTEyMw==
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: shopstream-data
type: Opaque
data:
  POSTGRES_USER: c2hvcHN0cmVhbQ==
  POSTGRES_PASSWORD: c2hvcHN0cmVhbTEyMw==
