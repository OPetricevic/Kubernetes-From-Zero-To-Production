apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service
  namespace: shopstream
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: user-service-role
  namespace: shopstream
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["user-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: user-service-binding
  namespace: shopstream
subjects:
  - kind: ServiceAccount
    name: user-service
    namespace: shopstream
roleRef:
  kind: Role
  name: user-service-role
  apiGroup: rbac.authorization.k8s.io
